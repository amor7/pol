name: quicdebug
on:
  push:
    branches: [quicdebug]
jobs:
  quic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo sysctl -w net.core.rmem_max=67108864 net.core.wmem_max=67108864
      - name: quic alone, 15 times, with the race detector
        run: go test -race -count=15 -run 'TestSpeedThroughEveryMode/quic|TestForeignAndClosedTargetsAreRefused/quic|TestForwardEcho/quic' ./internal/ 2>&1 | grep -E -- "--- FAIL|_test.go|^ok|^FAIL" || true
      - name: whole suite with the race detector, twice
        run: go test -race -count=2 ./internal/ 2>&1 | grep -E -- "--- FAIL|_test.go|^ok|^FAIL" || true
