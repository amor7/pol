name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: bash -n install.sh
      # faketcp needs raw sockets and iptables: only as root.
      - name: faketcp, as root
        run: sudo -E "$(command -v go)" test -count=1 -v -run 'TestForwardEcho/faketcp|TestLargeDownloadAndHalfClose/faketcp|TestLargeUploadIntact/faketcp|TestUDP/faketcp|TestSpeedThroughEveryMode/faketcp' ./internal/
