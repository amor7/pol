name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # UDP buffers as `pol tune` sets them on a server; the runner's tiny
      # defaults make QUIC drop packets under the race detector's load.
      - run: sudo sysctl -w net.core.rmem_max=67108864 net.core.wmem_max=67108864
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: bash -n install.sh
      # faketcp needs raw sockets and iptables: only as root.
      - name: faketcp, as root
        if: always()
        run: |
          sudo -E "$(command -v go)" test -count=1 -v -run 'TestForwardEcho/faketcp|TestLargeDownloadAndHalfClose/faketcp|TestLargeUploadIntact/faketcp|TestUDP/faketcp|TestSpeedThroughEveryMode/faketcp' ./internal/ || {
            echo "--- firewall, for diagnosis"; sudo iptables -S; sudo iptables -t raw -S; sudo nft list ruleset | head -80; exit 1; }
