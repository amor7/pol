name: bufcheck
on:
  push:
    branches: [bufcheck]
jobs:
  stability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: whole suite, 4 times, as the release build runs it
        run: |
          f=0; for i in 1 2 3 4; do go test -count=1 ./internal/... > out.txt 2>&1 || { f=$((f+1)); grep -E -- "--- FAIL|_test.go" out.txt | head -5; }; done; echo "PLAIN failures: $f/4"
      - name: whole suite, twice, with the race detector
        run: |
          f=0; for i in 1 2; do go test -race -count=1 ./internal/... > out.txt 2>&1 || { f=$((f+1)); grep -E -- "--- FAIL|_test.go" out.txt | head -5; }; done; echo "RACE failures: $f/2"
