name: bufcheck
on:
  push:
    branches: [bufcheck]
jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -c -o e2e.test ./internal/
      - name: default buffers
        run: |
          sysctl net.core.rmem_max
          f=0; for i in $(seq 10); do ./e2e.test -test.count=1 -test.run 'TestSpeedThroughEveryMode/(hop|kcp)|TestLargeDownloadAndHalfClose/(hop|kcp)' >/dev/null 2>&1 || f=$((f+1)); done; echo "DEFAULT failures: $f/10"
      - name: tuned buffers
        run: |
          sudo sysctl -w net.core.rmem_max=67108864 net.core.wmem_max=67108864
          f=0; for i in $(seq 10); do ./e2e.test -test.count=1 -test.run 'TestSpeedThroughEveryMode/(hop|kcp)|TestLargeDownloadAndHalfClose/(hop|kcp)' >/dev/null 2>&1 || f=$((f+1)); done; echo "TUNED failures: $f/10"
